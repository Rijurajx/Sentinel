<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 585" width="1024" height="585" style="background-color:#ffffff; font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e74c3c" />
    </marker>
    <marker id="arrow-red-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 8 1.5 L 0 5 L 8 8.5 z" fill="#e74c3c" />
    </marker>
  </defs>

  <!-- Slide Canvas Outer Border -->
  <rect x="1" y="1" width="1022" height="583" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- ========================================================
       CONNECTOR ARROWS & FLOW PATHS (Drawn first so behind shapes)
       ======================================================== -->
  
  <!-- 1. Start -> Login/Signup -->
  <path d="M 400 56 L 400 95" fill="none" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow-red)" />

  <!-- 2. Login/Signup <---> Authentication status (Two-way arrow) -->
  <path d="M 488 127 L 565 127" fill="none" stroke="#e74c3c" stroke-width="2" marker-start="url(#arrow-red-start)" marker-end="url(#arrow-red)" />

  <!-- 3. Unsuccessful loopback from Authentication Status back to Login/Signup -->
  <path d="M 665 67 L 665 24 Q 665 18 655 18 L 525 18 Q 515 18 515 28 L 515 127" fill="none" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow-red)" />
  <text x="590" y="38" font-size="14" font-weight="500" fill="#1a1a1a" text-anchor="middle">Unsuccessful</text>

  <!-- 4. Successful branch from Authentication status to Dashboard access -->
  <path d="M 665 187 L 665 220 Q 665 227 655 227 L 488 227" fill="none" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow-red)" />
  <text x="575" y="208" font-size="14" font-weight="500" fill="#1a1a1a" text-anchor="middle">Successful</text>

  <!-- 5. Dashboard access -> Ingest Inbound Threat -->
  <path d="M 400 255 L 400 292" fill="none" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow-red)" />

  <!-- 6. Ingest Inbound Threat -> Multimodal AI & Entity Extraction -->
  <path d="M 400 348 L 400 380" fill="none" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow-red)" />

  <!-- 7. Multimodal AI & Entity Extraction <---> Verification status (Two-way arrow) -->
  <path d="M 488 412 L 545 412" fill="none" stroke="#e74c3c" stroke-width="2" marker-start="url(#arrow-red-start)" marker-end="url(#arrow-red)" />

  <!-- 8. Unsuccessful / Mismatch loopback from Verification status -->
  <path d="M 630 357 L 630 310 Q 630 304 620 304 L 515 304 Q 505 304 505 314 L 505 412" fill="none" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow-red)" />
  <text x="568" y="294" font-size="13" font-weight="500" fill="#1a1a1a" text-anchor="middle">Unsuccessful</text>

  <!-- 9. Successful / Verified branch from Verification status to Horizontal Outcome Row -->
  <path d="M 630 467 L 630 495 Q 630 502 620 502 L 412 502" fill="none" stroke="#e74c3c" stroke-width="2" />
  <text x="520" y="488" font-size="14" font-weight="500" fill="#1a1a1a" text-anchor="middle">Successful</text>

  <!-- 10. Horizontal outcome distribution bar across the bottom -->
  <path d="M 95 502 L 925 502" fill="none" stroke="#e74c3c" stroke-width="2" />
  
  <!-- Dropping vertical arrows into each of the 5 bottom pills -->
  <path d="M 95 502 L 95 522" fill="none" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow-red)" />
  <path d="M 302 502 L 302 522" fill="none" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow-red)" />
  <path d="M 510 502 L 510 522" fill="none" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow-red)" />
  <path d="M 718 502 L 718 522" fill="none" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow-red)" />
  <path d="M 925 502 L 925 522" fill="none" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow-red)" />


  <!-- ========================================================
       PROCESS NODES & DIAMONDS (MATCHING EXACT VISUAL STYLE)
       ======================================================== -->

  <!-- 1. Start Pill -->
  <g id="node-start" transform="translate(400, 38)">
    <rect x="-42" y="-18" width="84" height="36" rx="18" fill="#feeaa1" stroke="#2e7d32" stroke-width="2.2" />
    <text x="0" y="4" font-size="15" font-weight="500" fill="#1a1a1a" text-anchor="middle">Start</text>
  </g>

  <!-- 2. Login/Signup Pill -->
  <g id="node-login" transform="translate(400, 127)">
    <rect x="-88" y="-27" width="176" height="54" rx="27" fill="#feeaa1" stroke="#2e7d32" stroke-width="2.2" />
    <text x="0" y="5" font-size="15" font-weight="500" fill="#1a1a1a" text-anchor="middle">Login/Signup</text>
  </g>

  <!-- 3. Authentication Status Diamond -->
  <g id="diamond-auth" transform="translate(665, 127)">
    <path d="M 0 -60 L 105 0 L 0 60 L -105 0 Z" fill="#feeaa1" stroke="#2e7d32" stroke-width="2.2" stroke-linejoin="round" />
    <text x="0" y="-6" font-size="15" font-weight="500" fill="#1a1a1a" text-anchor="middle">Authentication</text>
    <text x="0" y="14" font-size="15" font-weight="500" fill="#1a1a1a" text-anchor="middle">status</text>
  </g>

  <!-- 4. Dashboard Access Pill -->
  <g id="node-dashboard" transform="translate(400, 227)">
    <rect x="-88" y="-27" width="176" height="54" rx="27" fill="#feeaa1" stroke="#2e7d32" stroke-width="2.2" />
    <text x="0" y="5" font-size="15" font-weight="500" fill="#1a1a1a" text-anchor="middle">Dashboard access</text>
  </g>

  <!-- 5. Inbound Threat Ingestion Pill (Upload Invoice / Gmail) -->
  <g id="node-upload" transform="translate(400, 320)">
    <rect x="-88" y="-26" width="176" height="52" rx="26" fill="#feeaa1" stroke="#2e7d32" stroke-width="2.2" />
    <text x="0" y="-3" font-size="13.5" font-weight="500" fill="#1a1a1a" text-anchor="middle">Ingest Invoice /</text>
    <text x="0" y="15" font-size="13.5" font-weight="500" fill="#1a1a1a" text-anchor="middle">Live Gmail Radar</text>
  </g>

  <!-- 6. Multimodal AI & Entity Extraction Pill -->
  <g id="node-ai-extraction" transform="translate(400, 412)">
    <rect x="-88" y="-27" width="176" height="54" rx="27" fill="#feeaa1" stroke="#2e7d32" stroke-width="2.2" />
    <text x="0" y="-5" font-size="14" font-weight="500" fill="#1a1a1a" text-anchor="middle">AI Multimodal</text>
    <text x="0" y="14" font-size="14" font-weight="500" fill="#1a1a1a" text-anchor="middle">Verification</text>
  </g>

  <!-- 7. Verification Status Diamond -->
  <g id="diamond-verification" transform="translate(630, 412)">
    <path d="M 0 -55 L 85 0 L 0 55 L -85 0 Z" fill="#feeaa1" stroke="#2e7d32" stroke-width="2.2" stroke-linejoin="round" />
    <text x="0" y="-4" font-size="15" font-weight="500" fill="#1a1a1a" text-anchor="middle">verification</text>
    <text x="0" y="15" font-size="15" font-weight="500" fill="#1a1a1a" text-anchor="middle">status</text>
  </g>


  <!-- ========================================================
       BOTTOM ROW (5 OUTCOME ACTIONS / VIEWS)
       ======================================================== -->

  <!-- Outcome 1: Payment Hold / Freeze Gate -->
  <g id="outcome-1" transform="translate(95, 545)">
    <rect x="-84" y="-23" width="168" height="46" rx="23" fill="#feeaa1" stroke="#2e7d32" stroke-width="2.2" />
    <text x="0" y="4" font-size="13" font-weight="500" fill="#1a1a1a" text-anchor="middle">Payment Hold Status</text>
  </g>

  <!-- Outcome 2: View TrustGraph Network -->
  <g id="outcome-2" transform="translate(302, 545)">
    <rect x="-92" y="-26" width="184" height="52" rx="26" fill="#feeaa1" stroke="#2e7d32" stroke-width="2.2" />
    <text x="0" y="-3" font-size="13" font-weight="500" fill="#1a1a1a" text-anchor="middle">View TrustGraph</text>
    <text x="0" y="14" font-size="13" font-weight="500" fill="#1a1a1a" text-anchor="middle">entity provenance</text>
  </g>

  <!-- Outcome 3: Inspect FinGuard Ledger Diff -->
  <g id="outcome-3" transform="translate(510, 545)">
    <rect x="-86" y="-23" width="172" height="46" rx="23" fill="#feeaa1" stroke="#2e7d32" stroke-width="2.2" />
    <text x="0" y="4" font-size="13" font-weight="500" fill="#1a1a1a" text-anchor="middle">Audit bank &amp; IFSC diff</text>
  </g>

  <!-- Outcome 4: Gemini Spoofing Evidence -->
  <g id="outcome-4" transform="translate(718, 545)">
    <rect x="-92" y="-26" width="184" height="52" rx="26" fill="#feeaa1" stroke="#2e7d32" stroke-width="2.2" />
    <text x="0" y="-3" font-size="13" font-weight="500" fill="#1a1a1a" text-anchor="middle">Analyze Gemini</text>
    <text x="0" y="14" font-size="13" font-weight="500" fill="#1a1a1a" text-anchor="middle">threat reasoning</text>
  </g>

  <!-- Outcome 5: View Dossier & Live Updates -->
  <g id="outcome-5" transform="translate(925, 545)">
    <rect x="-92" y="-26" width="184" height="52" rx="26" fill="#feeaa1" stroke="#2e7d32" stroke-width="2.2" />
    <text x="0" y="-3" font-size="12.5" font-weight="500" fill="#1a1a1a" text-anchor="middle">View Dossier and</text>
    <text x="0" y="13" font-size="12.5" font-weight="500" fill="#1a1a1a" text-anchor="middle">other live updates</text>
  </g>


  <!-- ========================================================
       BOTTOM 4-COLOR GOOGLE STRIP (MATCHING REFERENCE EXACTLY)
       ======================================================== -->
  <rect x="0" y="575" width="256" height="10" fill="#ea4335" />
  <rect x="256" y="575" width="256" height="10" fill="#4285f4" />
  <rect x="512" y="575" width="256" height="10" fill="#34a853" />
  <rect x="768" y="575" width="256" height="10" fill="#fbbc05" />
</svg>