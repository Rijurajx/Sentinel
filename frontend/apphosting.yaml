# Firebase App Hosting configuration for SENTINEL Next.js Frontend
runConfig:
  minInstances: 0
  maxInstances: 4
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  - variable: NEXT_PUBLIC_API_URL
    value: "https://sentinel-backend-five.vercel.app"
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "sentinel-intel-ca67d"
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "sentinel-intel-ca67d.firebaseapp.com"
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "sentinel-intel-ca67d.firebasestorage.app"
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "940041698946"
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:940041698946:web:10d7da5f0554a736dffe9b"
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: "G-K106CVGYZY"
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyArFY4jnTm0EKSOd_c1aa5bwcbxq1W2hg4"
